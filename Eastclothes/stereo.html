<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e3b">
  <meta name="description" content="按六种风格展示24套EastAI卫衣正反面立体效果，支持筛选、搜索、放大查看与对应工服方案跳转。">
  <title>24套卫衣立体效果 · EastAI 30th</title>
  <link rel="preload" as="image" href="assets/stereo-mockups/05-03-thumb.webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stereo.css">
</head>
<body class="stereo-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回 EastAI 工服图案展示首页">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span><strong>EastAI</strong><small>30TH · UNIFORM GALLERY</small></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
      <a href="index.html#gallery">平面效果图</a>
      <a href="stereo.html" aria-current="page">卫衣效果图</a>
      <a href="stereo-artwork.html">立体主图</a>
    </nav>
    <a class="top-cta" href="index.html#gallery">查看工服方案 <span aria-hidden="true">↗</span></a>
  </header>

  <main>
    <section class="gallery-section stereo-gallery" id="stereo-collection" aria-labelledby="stereo-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow dark-eyebrow">THE GARMENT COLLECTION <span>01 — 24</span></p>
          <h1 id="stereo-title">24套卫衣立体效果图</h1>
        </div>
        <p class="section-note">按风格浏览正反面上身效果，点开可放大查看并跳转到对应方案。</p>
      </div>

      <div class="toolbar">
        <div class="filters" id="stereoFilters" role="toolbar" aria-label="按风格筛选"></div>
        <label class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <span class="visually-hidden">搜索卫衣效果</span>
          <input id="stereoSearch" type="search" placeholder="搜索款名或风格" autocomplete="off">
          <kbd>/</kbd>
        </label>
      </div>
      <p class="result-count" id="stereoResult" aria-live="polite"></p>
      <div id="stereoGroups" class="style-groups"></div>
      <div class="empty-state" id="stereoEmpty" hidden>
        <span class="empty-symbol" aria-hidden="true">⌕</span>
        <h2>没有找到匹配的卫衣效果</h2>
        <p>试试其他款名，或切换到「全部」。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="index.html"><span class="brand-mark" aria-hidden="true">E</span><strong>EastAI <span>30TH</span></strong></a>
    <p>本栏目按原素材目录展示24套正反面组合效果，分为6种风格。图片已优化尺寸，原始素材保留在素材目录。</p>
    <a class="back-top" href="#" aria-label="返回页面顶部">回到顶部 <span aria-hidden="true">↑</span></a>
  </footer>

  <dialog class="detail-dialog stereo-dialog" id="stereoDialog" aria-labelledby="stereoDialogTitle">
    <div class="dialog-inner">
      <div class="dialog-top">
        <div class="dialog-heading">
          <p class="dialog-kicker" id="stereoDialogKicker"></p>
          <h2 id="stereoDialogTitle"></h2>
        </div>
        <div class="dialog-actions">
          <span class="dialog-counter" id="stereoDialogCounter"></span>
          <button class="icon-button close-button" id="stereoClose" type="button" aria-label="关闭卫衣效果图">×</button>
        </div>
      </div>
      <div class="stereo-viewer-stage">
        <button class="icon-button stereo-viewer-nav" id="stereoPrevious" type="button" aria-label="上一套卫衣效果">←</button>
        <img id="stereoViewerImage" src="" alt="">
        <button class="icon-button stereo-viewer-nav" id="stereoNext" type="button" aria-label="下一套卫衣效果">→</button>
      </div>
      <div class="stereo-dialog-foot">
        <span>正面胸标与背部图案组合效果</span>
        <a class="stereo-match-link" id="stereoMatchingLink" href="index.html#gallery">查看对应工服方案 <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="stereo.js"></script>
</body>
</html>
